
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You ♡</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #8ab9e8;
  font-family: Georgia, serif;
}

#scene {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(145deg, #a9d2f5, #739fd4, #dce9fa);
  transition: opacity 1s, visibility 1s;
}

#lockScreen.open {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.lockBox {
  width: min(330px, 88vw);
  padding: 30px 24px;
  text-align: center;
  border: 1px solid #ffffffa0;
  border-radius: 28px;
  background: #ffffff25;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 70px #315b8a35;
}

.lockIcon {
  font-size: 66px;
  color: white;
  margin-bottom: 12px;
  text-shadow: 0 5px 25px #416b9b55;
  animation: lockFloat 3s ease-in-out infinite;
}

@keyframes lockFloat {
  50% { transform: translateY(-7px); }
}

.lockBox h1 {
  color: white;
  font-size: 17px;
  font-weight: normal;
  letter-spacing: 4px;
  margin-bottom: 22px;
}

#display {
  min-height: 35px;
  color: white;
  font: 22px Arial, sans-serif;
  letter-spacing: 10px;
  margin-bottom: 20px;
  padding-left: 10px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.key {
  height: 49px;
  border: 1px solid #ffffff80;
  border-radius: 15px;
  background: #ffffff30;
  color: white;
  font-size: 19px;
  cursor: pointer;
  transition: .2s;
}

.key:hover {
  background: #ffffff65;
}

.key:active {
  transform: scale(.93);
}

#unlock {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: 1px solid #ffffffa0;
  border-radius: 20px;
  background: #edf6ffbb;
  color: #315a87;
  letter-spacing: 4px;
  cursor: pointer;
}

#message {
  min-height: 18px;
  margin-top: 12px;
  color: white;
  font: 11px Arial, sans-serif;
  letter-spacing: 1px;
}

#title {
  position: fixed;
  z-index: 3;
  top: 7%;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: clamp(35px, 7vw, 56px);
  font-weight: normal;
  letter-spacing: 3px;
  text-shadow: 0 4px 30px #315b8a65;
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 2s, transform 2s;
  pointer-events: none;
}

#title.show {
  opacity: 1;
  transform: translateY(0);
}

#subtitle {
  position: fixed;
  z-index: 3;
  top: calc(7% + 70px);
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 12px;
  letter-spacing: 4px;
  opacity: 0;
  transition: opacity 2s;
  pointer-events: none;
}

#subtitle.show {
  opacity: .9;
}

#loading {
  position: fixed;
  z-index: 4;
  bottom: 85px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font: 11px Arial, sans-serif;
  letter-spacing: 3px;
  opacity: 0;
  transition: opacity 1s;
  pointer-events: none;
}

#loading.show {
  opacity: 1;
}

#music {
  position: fixed;
  z-index: 11;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid #ffffff90;
  border-radius: 30px;
  color: white;
  background: #467ebd80;
  backdrop-filter: blur(10px);
  letter-spacing: 2px;
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s;
}

#music.show {
  opacity: 1;
  pointer-events: auto;
}

#hint {
  position: fixed;
  bottom: 76px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 12px;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 2s;
  pointer-events: none;
}

#hint.show {
  opacity: .85;
}

@media (max-height: 650px) {
  .lockBox { padding: 18px 22px; }
  .lockIcon { font-size: 48px; margin-bottom: 6px; }
  .lockBox h1 { margin-bottom: 12px; }
  .key { height: 42px; }
  .keypad { gap: 7px; }
  #display { margin-bottom: 12px; }
}
</style>
</head>

<body>

<div id="scene"></div>

<section id="lockScreen">
  <div class="lockBox">
    <div class="lockIcon">♙</div>
    <h1>ENTER PASSCODE</h1>

    <div id="display">— — — —</div>

    <div class="keypad">
      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key" data-action="clear">C</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="delete">⌫</button>
    </div>

    <button id="unlock">UNLOCK</button>
    <div id="message"></div>
  </div>
</section>

<div id="title">For You ♡</div>
<div id="subtitle">A LITTLE GIFT, JUST FOR YOU</div>
<div id="loading">MADE WITH LOVE</div>
<div id="hint">a little flower for my favorite person ♡</div>

<button id="music">♫ PLAY MUSIC</button>

<audio id="song" loop preload="none">
  <source src="./daylight.mp3" type="audio/mpeg">
</audio>

<script>
/* =================================
   PASSWORD SYSTEM
================================= */
(() => {
  let passcode = "";
  let unlocked = false;

  const display = document.querySelector("#display");
  const message = document.querySelector("#message");
  const lockScreen = document.querySelector("#lockScreen");
  const musicButton = document.querySelector("#music");
  const song = document.querySelector("#song");

  function updateDisplay() {
    display.textContent = passcode
      ? passcode.split("").join(" ") +
        " " + "— ".repeat(4 - passcode.length)
      : "— — — —";
  }

  document.querySelectorAll("[data-number]").forEach(button => {
    button.addEventListener("click", () => {
      if (unlocked || passcode.length >= 4) return;

      passcode += button.dataset.number;
      updateDisplay();
      message.textContent = "";
    });
  });

  document.querySelector('[data-action="clear"]')
    .addEventListener("click", () => {
      if (unlocked) return;
      passcode = "";
      updateDisplay();
      message.textContent = "";
    });

  document.querySelector('[data-action="delete"]')
    .addEventListener("click", () => {
      if (unlocked) return;
      passcode = passcode.slice(0, -1);
      updateDisplay();
      message.textContent = "";
    });

  document.querySelector("#unlock").addEventListener("click", async () => {
    if (unlocked) return;

    if (passcode !== "2305") {
      message.textContent = "KODE SALAH — COBA LAGI";
      passcode = "";
      updateDisplay();

      const box = document.querySelector(".lockBox");
      box.animate(
        [
          { transform: "translateX(0)" },
          { transform: "translateX(-7px)" },
          { transform: "translateX(7px)" },
          { transform: "translateX(0)" }
        ],
        { duration: 250 }
      );
      return;
    }

    unlocked = true;
    message.textContent = "";
    lockScreen.classList.add("open");

    document.querySelector("#title").classList.add("show");
    document.querySelector("#subtitle").classList.add("show");
    document.querySelector("#hint").classList.add("show");
    document.querySelector("#loading").classList.add("show");
    musicButton.classList.add("show");

    window.dispatchEvent(new Event("bouquet-unlock"));

    try {
      await song.play();
      musicButton.textContent = "♫ PAUSE MUSIC";
    } catch {
      musicButton.textContent = "♫ PLAY MUSIC";
    }
  });

  musicButton.addEventListener("click", async () => {
    if (song.paused) {
      try {
        await song.play();
        musicButton.textContent = "♫ PAUSE MUSIC";
      } catch {
        musicButton.textContent = "♫ ADD MUSIC FILE";
      }
    } else {
      song.pause();
      musicButton.textContent = "♫ PLAY MUSIC";
    }
  });

  updateDisplay();
})();
</script>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =================================
   SCENE SETUP
================================= */
const container = document.querySelector("#scene");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#8ab9e8");
scene.fog = new THREE.Fog("#8ab9e8", 12, 32);

const camera = new THREE.PerspectiveCamera(
  40,
  innerWidth / innerHeight,
  0.1,
  100
);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
container.appendChild(renderer.domElement);

/* =================================
   LIGHTING
================================= */
scene.add(new THREE.HemisphereLight(0xfff5f8, 0x506c99, 2.5));

const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
keyLight.position.set(-4, 7, 8);
scene.add(keyLight);

const pinkLight = new THREE.PointLight(0xffa9d1, 35, 24);
pinkLight.position.set(4, 2, 4);
scene.add(pinkLight);

const blueLight = new THREE.PointLight(0xa6d5ff, 25, 20);
blueLight.position.set(-4, -2, 4);
scene.add(blueLight);

/* =================================
   FLOATING LIGHT PARTICLES
================================= */
const particles = [];

for (let i = 0; i < 90; i++) {
  const r = 0.025 + Math.random() * 0.08;

  const material = new THREE.MeshBasicMaterial({
    color: i % 3 === 0 ? "#ffffff" : "#e5efff",
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });

  const particle = new THREE.Mesh(
    new THREE.CircleGeometry(r, 16),
    material
  );

  particle.position.set(
    (Math.random() - 0.5) * 17,
    (Math.random() - 0.5) * 11,
    -2 - Math.random() * 8
  );

  particle.userData.baseY = particle.position.y;
  particle.userData.phase = Math.random() * 8;
  scene.add(particle);
  particles.push(particle);
}

/* =================================
   FLOWER MATERIALS
================================= */
const petalMaterials = [
  new THREE.MeshStandardMaterial({
    color: "#ef789d",
    roughness: 0.48,
    side: THREE.DoubleSide
  }),
  new THREE.MeshStandardMaterial({
    color: "#f6a2bb",
    roughness: 0.48,
    side: THREE.DoubleSide
  }),
  new THREE.MeshStandardMaterial({
    color: "#c83e70",
    roughness: 0.5,
    side: THREE.DoubleSide
  }),
  new THREE.MeshStandardMaterial({
    color: "#fff0f4",
    roughness: 0.5,
    side: THREE.DoubleSide
  })
];

const leafMaterial = new THREE.MeshStandardMaterial({
  color: "#347957",
  roughness: 0.65,
  side: THREE.DoubleSide
});

const stemMaterial = new THREE.MeshStandardMaterial({
  color: "#3d8059",
  roughness: 0.7
});

const goldMaterial = new THREE.MeshStandardMaterial({
  color: "#f1d29a",
  metalness: 0.55,
  roughness: 0.35
});

const bouquet = new THREE.Group();
bouquet.visible = false;
scene.add(bouquet);

/* =================================
   CURVED PETAL SHAPE
================================= */
function createPetal(length, width, material) {
  const shape = new THREE.Shape();

  shape.moveTo(0, 0);
  shape.bezierCurveTo(
    -width * 0.6, length * 0.25,
    -width * 0.8, length * 0.8,
    0, length
  );
  shape.bezierCurveTo(
    width * 0.8, length * 0.8,
    width * 0.6, length * 0.25,
    0, 0
  );

  const geometry = new THREE.ShapeGeometry(shape, 12);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  return mesh;
}

/* =================================
   CREATE A ROSE
================================= */
function createRose(position, size, colorIndex, bloomIndex) {
  const flower = new THREE.Group();
  flower.position.copy(position);

  const color = petalMaterials[colorIndex % petalMaterials.length];

  // Petals in several overlapping layers
  const layers = [
    { count: 9, radius: 0.23, length: 0.48, width: 0.24, tilt: 0.18 },
    { count: 8, radius: 0.15, length: 0.40, width: 0.21, tilt: 0.38 },
    { count: 6, radius: 0.08, length: 0.31, width: 0.18, tilt: 0.58 },
    { count: 5, radius: 0.025, length: 0.23, width: 0.15, tilt: 0.75 }
  ];

  layers.forEach((layer, layerIndex) => {
    for (let i = 0; i < layer.count; i++) {
      const angle = (i / layer.count) * Math.PI * 2
        + layerIndex * 0.35 + bloomIndex * 0.7;

      const petal = createPetal(
        layer.length * size,
        layer.width * size,
        layerIndex === 0 ? color : petalMaterials[
          (colorIndex + (layerIndex === 2 ? 1 : 0))
          % petalMaterials.length
        ]
      );

      petal.position.set(
        Math.cos(angle) * layer.radius * size,
        Math.sin(angle) * layer.radius * size,
        layerIndex * 0.025 * size
      );

      petal.rotation.z = -angle + Math.PI / 2;
      petal.rotation.x = -layer.tilt;
      petal.rotation.y = Math.cos(angle) * 0.18;
      flower.add(petal);
    }
  });

  // Center of the flower
  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.095 * size, 16, 12),
    new THREE.MeshStandardMaterial({
      color: colorIndex === 3 ? "#e7b95c" : "#e5a64d",
      roughness: 0.55
    })
  );
  center.position.z = 0.08 * size;
  flower.add(center);

  // Tiny details around the center
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI * 2 / 10;
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.018 * size, 8, 8),
      goldMaterial
    );
    dot.position.set(
      Math.cos(a) * 0.065 * size,
      Math.sin(a) * 0.065 * size,
      0.15 * size
    );
    flower.add(dot);
  }

  bouquet.add(flower);
  return flower;
}

/* =================================
   CREATE LEAVES
================================= */
function createLeaf(start, angle, length, scale = 1) {
  const leaf = new THREE.Group();

  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(
    -0.14 * scale, length * 0.2,
    -0.18 * scale, length * 0.75,
    0, length
  );
  shape.bezierCurveTo(
    0.18 * scale, length * 0.75,
    0.14 * scale, length * 0.2,
    0, 0
  );

  const mesh = new THREE.Mesh(
    new THREE.ShapeGeometry(shape, 10),
    leafMaterial
  );

  leaf.add(mesh);
  leaf.position.copy(start);
  leaf.rotation.z = angle;
  leaf.rotation.y = angle * 0.25;
  bouquet.add(leaf);
}

/* =================================
   BUILD BOUQUET WITHOUT EXTERNAL FILES
================================= */
const stems = [
  { x: -1.45, y: 1.10, z: 0.00, s: 0.82, c: 1 },
  { x: -0.85, y: 1.85, z: 0.20, s: 0.95, c: 0 },
  { x: -0.15, y: 2.15, z: 0.10, s: 1.02, c: 3 },
  { x:  0.55, y: 1.95, z: 0.15, s: 0.95, c: 1 },
  { x:  1.20, y: 1.35, z: 0.00, s: 0.86, c: 2 },
  { x: -1.00, y: 0.85, z: 0.35, s: 0.78, c: 3 },
  { x:  0.00, y: 1.15, z: 0.45, s: 0.86, c: 0 },
  { x:  0.90, y: 0.88, z: 0.30, s: 0.76, c: 1 }
];

stems.forEach((item, i) => {
  const head = new THREE.Vector3(item.x, item.y, item.z);
  const base = new THREE.Vector3(item.x * 0.30, -1.45, item.z);

  const direction = new THREE.Vector3().subVectors(base, head);
  const length = direction.length();

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.04, length, 8),
    stemMaterial
  );

  stem.position.copy(head).add(base).multiplyScalar(0.5);
  stem.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  bouquet.add(stem);

  // Two leaves per stem
  createLeaf(
    new THREE.Vector3(item.x * 0.7, -0.05 + i * 0.025, item.z),
    i % 2 === 0 ? 0.9 : 2.3,
    0.48,
    0.9
  );

  createLeaf(
    new THREE.Vector3(item.x * 0.45, -0.65, item.z + 0.05),
    i % 2 === 0 ? 2.4 : 0.6,
    0.40,
    0.8
  );

  createRose(head, item.s, item.c, i);
});

/* =================================
   BOUQUET WRAPPING PAPER
================================= */
function makeCone(topRadius, bottomRadius, height, color, y, z) {
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.7,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      topRadius, bottomRadius, height, 48, 1, true
    ),
    material
  );

  mesh.position.set(0, y, z);
  mesh.rotation.x = 0.10;
  bouquet.add(mesh);
  return mesh;
}

// Outer pale wrapping
makeCone(1.75, 0.55, 2.55, "#f5dce5", -0.15, -0.18);

// Front folded panel
const frontPaper = new THREE.Mesh(
  new THREE.ConeGeometry(1.25, 2.55, 4, 1, true),
  new THREE.MeshStandardMaterial({
    color: "#fff1f5",
    roughness: 0.72,
    side: THREE.DoubleSide
  })
);

frontPaper.position.set(0, -0.15, 0.58);
frontPaper.rotation.y = Math.PI / 4;
frontPaper.rotation.x = 0.08;
bouquet.add(frontPaper);

// Ribbon
const ribbon = new THREE.Mesh(
  new THREE.TorusGeometry(0.29, 0.055, 12, 32),
  new THREE.MeshStandardMaterial({
    color: "#bb527d",
    metalness: 0.1,
    roughness: 0.45
  })
);

ribbon.position.set(0, -1.12, 0.62);
bouquet.add(ribbon);

function makeRibbonLoop(x, angle) {
  const loop = new THREE.Mesh(
    new THREE.TorusGeometry(0.19, 0.045, 10, 24, Math.PI * 1.6),
    new THREE.MeshStandardMaterial({
      color: "#d982a5",
      roughness: 0.45
    })
  );
  loop.position.set(x, -1.12, 0.61);
  loop.rotation.z = angle;
  bouquet.add(loop);
}

makeRibbonLoop(-0.24, 0.55);
makeRibbonLoop(0.24, 2.55);

// Small paper heart
const heartShape = new THREE.Shape();
heartShape.moveTo(0, -0.13);
heartShape.bezierCurveTo(-0.35, 0.1, -0.25, 0.35, 0, 0.18);
heartShape.bezierCurveTo(0.25, 0.35, 0.35, 0.1, 0, -0.13);

const heart = new THREE.Mesh(
  new THREE.ShapeGeometry(heartShape),
  new THREE.MeshBasicMaterial({
    color: "#ce6d92",
    side: THREE.DoubleSide
  })
);

heart.scale.set(0.24, 0.24, 0.24);
heart.position.set(0.35, -0.25, 0.68);
bouquet.add(heart);

/* =================================
   FLOATING MINI PETALS
================================= */
const floatingPetals = [];

for (let i = 0; i < 18; i++) {
  const petal = createPetal(
    0.22 + Math.random() * 0.16,
    0.12 + Math.random() * 0.08,
    petalMaterials[i % petalMaterials.length]
  );

  petal.position.set(
    (Math.random() - 0.5) * 9,
    (Math.random() - 0.5) * 7,
    -1 + Math.random() * 2
  );

  petal.visible = false;
  petal.userData.baseX = petal.position.x;
  petal.userData.baseY = petal.position.y;
  petal.userData.phase = Math.random() * 8;
  petal.userData.speed = 0.3 + Math.random() * 0.5;

  scene.add(petal);
  floatingPetals.push(petal);
}

/* =================================
   UNLOCK ANIMATION
================================= */
let unlocked = false;
let openingTime = 0;
let pointerX = 0;
let pointerY = 0;

window.addEventListener("bouquet-unlock", () => {
  unlocked = true;
  openingTime = performance.now();

  bouquet.visible = true;
  bouquet.scale.setScalar(0.001);

  // Center the bouquet and make it fit on mobile
  bouquet.position.set(0, -0.35, 0);
  document.querySelector("#loading").textContent = "MADE WITH LOVE";
  document.querySelector("#loading").classList.add("show");

  floatingPetals.forEach(p => p.visible = true);
});

window.addEventListener("pointermove", event => {
  pointerX = (event.clientX / innerWidth - 0.5) * 0.3;
  pointerY = (event.clientY / innerHeight - 0.5) * 0.2;
});

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =================================
   ANIMATION LOOP
================================= */
function animate(now) {
  requestAnimationFrame(animate);

  const t = now * 0.001;

  particles.forEach(p => {
    p.position.y = p.userData.baseY +
      Math.sin(t * 0.45 + p.userData.phase) * 0.20;

    p.material.opacity = 0.20 +
      0.20 * (0.5 + 0.5 * Math.sin(t + p.userData.phase));
  });

  if (unlocked) {
    const progress = Math.min((now - openingTime) / 1700, 1);
    const eased = 1 - Math.pow(1 - progress, 3);

    bouquet.scale.setScalar(eased);
    bouquet.rotation.y =
      Math.sin(t * 0.55) * 0.07 + pointerX * 0.25;

    bouquet.rotation.x +=
      (pointerY * 0.15 - bouquet.rotation.x) * 0.025;

    bouquet.position.y = -0.35 + Math.sin(t * 0.9) * 0.07;

    floatingPetals.forEach(p => {
      p.position.y = p.userData.baseY +
        Math.sin(t * p.userData.speed + p.userData.phase) * 0.5;

      p.position.x = p.userData.baseX +
        Math.sin(t * 0.3 + p.userData.phase) * 0.3;

      p.rotation.z += 0.003;
    });
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
